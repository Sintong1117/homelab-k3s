apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    chart: traefik
    targetRevision: '*' # Selalu ambil versi terbaru
    helm:
      values: |
        deployment:
          replicas: 1
        ingressClass:
          enabled: true
          isDefaultClass: true
        service:
          spec:
            type: LoadBalancer
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true