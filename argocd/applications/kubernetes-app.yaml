apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Sintong1117/homelab-k3s.git'
    targetRevision: HEAD
    path: kubernetes
    directory:
      recurse: true  # <-- MEMAKSA ARGO CD MEMBACA SEMUA SUB-FOLDER
      jsonnet: {}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true