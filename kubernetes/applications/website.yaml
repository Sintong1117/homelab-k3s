# ============================================
# 1. Deployment - Flask App (Portofolio)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portofolio-web
  namespace: default
  labels:
    app: portofolio-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portofolio-web
  template:
    metadata:
      labels:
        app: portofolio-web
    spec:
      containers:
        - name: portofolio-web
          image: batara593/portofolio-web:v1
          imagePullPolicy: Always   # agar selalu ambil tag terbaru saat testing
          ports:
            - name: http
              containerPort: 5000
          env:
            # DB_HOST diarahkan ke Service RW (read-write) yang dibuat CNPG
            - name: DB_HOST
              value: "portofolio-db-rw"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: portofolio-db-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: portofolio-db-app
                  key: user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: portofolio-db-app
                  key: password
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          # Health check agar Kubernetes bisa restart kalau app hang
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

---
# ============================================
# 2. Service - expose port 80 -> 5000
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: portofolio-web
  namespace: default
  labels:
    app: portofolio-web
spec:
  type: ClusterIP
  selector:
    app: portofolio-web
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP

---
# ============================================
# 3. Ingress - via Traefik
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portofolio-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: portofolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portofolio-web
                port:
                  number: 80