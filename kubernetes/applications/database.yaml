# ============================================
# CloudNativePG Cluster - PostgreSQL untuk Portofolio
# ============================================
# Catatan:
# - bootstrap.initdb TIDAK mengisi field 'secret:' agar CNPG
#   otomatis membuat Secret "portofolio-db-app" (nama default
#   <cluster>-app) lengkap dengan key: username, password,
#   dbname, host, port, uri, jdbc-uri.
# - options bersifat mutually exclusive dengan encoding/
#   localeCType/localeCollate, jadi semua parameter ditulis
#   lengkap di options.
# - huge_pages=off mencegah initdb crash di node dengan
#   hugepages aktif.
# ============================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portofolio-db
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/postgres: unconfined
    container.apparmor.security.beta.kubernetes.io/initdb: unconfined
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    size: 1Gi
    storageClass: openebs-hostpath

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  bootstrap:
    initdb:
      database: app
      owner: app
      options:
        - "--encoding=UTF8"
        - "--lc-collate=C"
        - "--lc-ctype=C"
        - "-c"
        - "huge_pages=off"