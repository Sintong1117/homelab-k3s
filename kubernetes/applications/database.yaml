# ============================================
# CloudNativePG Cluster - PostgreSQL untuk Portofolio
# ============================================
# Cluster ini otomatis membuat Secret "portofolio-db-app"
# dengan key: dbname, user, password, host, port, uri, jdbc-uri
# yang direferensikan oleh website.yaml
#
# Catatan penting:
# - bootstrap.initdb WAJIB ada agar Secret portofolio-db-app terbentuk.
# - options bersifat mutually exclusive dengan encoding/localeCType/
#   localeCollate, jadi semua parameter ditulis lengkap di options.
# - huge_pages=off adalah pencegahan agar initdb tidak crash di node
#   yang mengaktifkan hugepages.
# ============================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portofolio-db
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  storage:
    size: 1Gi
    storageClass: openebs-hostpath

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: portofolio-db-app
      options:
        - "--encoding=UTF8"
        - "--lc-collate=C"
        - "--lc-ctype=C"
        - "-c"
        - "huge_pages=off"

  # Backup minimal (opsional, bisa dihapus kalau tidak perlu)
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://bucket/path
  #     s3Credentials:
  #       accessKeyId:
  #         name: s3-creds
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: s3-creds
  #         key: SECRET_ACCESS_KEY